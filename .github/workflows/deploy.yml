name: Frontend CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout frontend code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/task-manager-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/task-manager-frontend:${{ github.sha }}

      - name: Deploy frontend and reload Nginx
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/task-manager-frontend:${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE
          script: |
            set -e

            echo "Pulling frontend image..."
            sudo docker pull "$IMAGE"

            echo "Replacing frontend container..."
            sudo docker stop task-manager-frontend-container || true
            sudo docker rm task-manager-frontend-container || true

            sudo docker run -d \
              --name task-manager-frontend-container \
              --restart unless-stopped \
              -p 127.0.0.1:4173:4173 \
              "$IMAGE"

            echo "Checking Nginx configuration..."
            sudo nginx -t

            echo "Reloading existing Nginx service..."
            sudo systemctl reload nginx

            echo "Checking deployment..."
            sudo docker ps