name: Frontend CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout frontend repository
      - name: Checkout frontend code
        uses: actions/checkout@v4

      # 2. Configure Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build and push frontend image
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/task-manager-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/task-manager-frontend:${{ github.sha }}

      # 5. Deploy frontend container to EC2
      - name: Deploy frontend to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/task-manager-frontend:${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE
          script: |
            set -e

            echo "Pulling frontend image..."
            sudo docker pull "$IMAGE"

            echo "Stopping old frontend container..."
            sudo docker stop task-manager-frontend-container || true

            echo "Removing old frontend container..."
            sudo docker rm task-manager-frontend-container || true

            echo "Starting new frontend container..."
            sudo docker run -d \
              --name task-manager-frontend-container \
              --restart unless-stopped \
              -p 127.0.0.1:4173:4173 \
              "$IMAGE"

            echo "Checking frontend container..."
            sudo docker ps --filter name=task-manager-frontend-container

            echo "Testing Nginx configuration..."
            sudo nginx -t

            echo "Enabling Nginx at boot..."
            sudo systemctl enable nginx

            echo "Starting or reloading Nginx..."
            if sudo systemctl is-active --quiet nginx; then
              sudo systemctl reload nginx
            else
              sudo systemctl start nginx
            fi

            echo "Checking Nginx status..."
            sudo systemctl is-active nginx

            echo "Testing frontend response through Nginx..."
            curl --fail --silent --show-error \
              http://127.0.0.1/ \
              --output /dev/null

            echo "Frontend deployment completed successfully."